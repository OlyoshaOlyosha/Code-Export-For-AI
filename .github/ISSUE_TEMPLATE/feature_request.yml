name: Feature request
description: Suggest an idea for the project
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What problem would this feature solve for you?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: What should the tool do?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Optional — workarounds or other approaches you thought about.
