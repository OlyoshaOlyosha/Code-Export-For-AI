[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Pragmatic ruleset: real errors + pyflakes + bugbear + exception handling + security.
# Drops the strict `ALL` set (docstrings, naming, complexity, style nits) that blocked development.
select = ["E4", "E7", "E9", "F", "B", "TRY", "S"]
ignore = [
    "S105",  # False positive: ordinary words mistaken for passwords
    "S107",  # Hardcoded password in kwarg (config/string literals) — false positive
    "S108",  # Hardcoded password in variable (config/string literals) — false positive
    "S310",  # Fixed GitHub URL with timeout – no SSRF risk
    "S110",  # try/except pass (suppress-style) in production code
    "B904",  # `raise ... from` in CLI entrypoint – cosmetic, not a bug
    "TRY003", # Long messages in exceptions
    "TRY300", # Consider moving to an else block
    "TRY301", # Abstract raise in try
    "B007",   # Loop control variable not used
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "F841"]  # assert; unused test vars are harmless dead code

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
